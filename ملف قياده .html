<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اختبار مهارات القيادة</title><style>body{margin:0;background:#edf2f7;font-family:Tahoma,Arial;color:#183047}.wrap{max-width:760px;margin:25px auto;padding:18px}.panel{background:white;border-radius:20px;padding:28px;box-shadow:0 8px 30px #1b35501a}h1{color:#123c59}button{background:#116b78;color:white;border:0;border-radius:10px;padding:13px 22px;font-size:17px;cursor:pointer}button:disabled{opacity:.4}.option{display:block;border:1px solid #d9e3e9;border-radius:12px;margin:9px 0;padding:13px;cursor:pointer}.option:has(input:checked){background:#def3f0;border-color:#118b83}input{accent-color:#087e78}.muted{color:#607789}.bar{height:9px;background:#e3eaf0;border-radius:10px;overflow:hidden}.fill{height:100%;background:#168b88;transition:.2s}footer{text-align:center;padding:24px;color:#436175}#result{display:none}.scores{margin:18px 0}.score{margin:12px 0}.actions{display:flex;gap:10px;flex-wrap:wrap}</style></head><body><div class="wrap"><section class="panel"><div id="quiz"><h1>اختبار قياس مهارات القيادة</h1><p class="muted">30 موقفًا عمليًا لاكتشاف أسلوبك القيادي الغالب. اختر التصرف الأقرب لك، ولا توجد إجابة صحيحة أو خاطئة.</p><p id="counter"></p><div class="bar"><div id="fill" class="fill"></div></div><h2 id="question"></h2><div id="choices"></div><div class="actions"><button id="prev" onclick="move(-1)">السابق</button><button id="next" onclick="move(1)" disabled>التالي</button></div></div><div id="result"><h1>نتيجتك القيادية</h1><h2 id="leader"></h2><p id="desc"></p><div id="scores" class="scores"></div><p class="muted">هذه أداة تدريبية للتأمل الذاتي وليست اختبارًا نفسيًا مقننًا أو تشخيصًا رسميًا.</p><div class="actions"><button onclick="window.print()">طباعة النتيجة</button><button onclick="share()">مشاركة النتيجة</button><button onclick="location.reload()">إعادة الاختبار</button></div></div></section><footer>إنشاء وتصميم: المهندس عبدالله مشعان العنزي</footer></div><script>
const styles=['الحازم','الديمقراطي','التحويلي','التشاركي','التوجيهي'];
const descriptions=['تتخذ القرارات بوضوح وتضع حدودًا ومسؤوليات محددة. طوّر مهارة الإصغاء قبل الحسم.','تستمع للآراء وتوازن بين وجهات النظر قبل القرار. احرص على عدم إطالة النقاش.','تحفز الآخرين بالرؤية والتجديد وتمنحهم معنى للعمل. عزز المتابعة العملية للتنفيذ.','تبني التعاون وتوزع المسؤولية وتشجع الملكية الجماعية للنتائج. وضّح صاحب القرار النهائي.','تركز على التعليمات والخطوات والمتابعة الدقيقة. امنح الفريق مساحة أكبر للمبادرة عند الجاهزية.'];
const scenarios=['تأخر الفريق في تسليم مشروع مهم','حدث خلاف بين اثنين من الموظفين','ظهرت أزمة مفاجئة أثناء العمل','اقترح موظف فكرة جديدة','انخفض مستوى أداء الفريق','احتجت إلى توزيع مهام صعبة','لم يلتزم أحد الأعضاء بالموعد','طُلب منك تغيير طريقة العمل','انضم موظف جديد إلى الفريق','كان لديك قرار بوقت محدود','ارتكب أحد أعضاء الفريق خطأ','نجح الفريق في تحقيق هدفه','لاحظت ضعف الحماس لدى الموظفين','اعترض الفريق على قرار إداري','ظهرت فرصة لتحسين الخدمة','تكرر سوء الفهم في التعليمات','احتجت إلى اختيار قائد لمهمة','اختلفت الآراء حول الأولويات','واجه الفريق ضغط عمل شديدًا','طلب موظف صلاحيات إضافية','لم تتضح مسؤوليات أعضاء الفريق','واجه المشروع مقاومة للتغيير','كانت الموارد المتاحة محدودة','أصبح الاجتماع غير منتج','تراجع مستوى جودة المخرجات','اكتشفت موهبة لدى موظف','اضطررت إلى تفويض مهمة حساسة','واجه الفريق شكوى من مستفيد','ظهرت مشكلة بين إدارتين','حان وقت تقييم أداء الفريق'];
const options=['أحدد المطلوب بوضوح وأحسم الإجراء المناسب.','أستمع لآراء الجميع ثم أختار الحل الأكثر قبولًا.','أربط الموقف برؤية ملهمة وأشجع حلولًا مبتكرة.','أشرك أعضاء الفريق في بناء الحل وتقاسم تنفيذه.','أضع خطوات وتعليمات دقيقة وأتابع التنفيذ.'];
const answers=Array(30).fill(null);let current=0;const $=id=>document.getElementById(id);
function render(){ $('counter').textContent=`السؤال ${current+1} من 30`; $('fill').style.width=((current+1)/30*100)+'%';$('question').textContent=scenarios[current]+'، كيف تتصرف؟';const order=[0,1,2,3,4].sort((a,b)=>((a*7+current*3)%5)-((b*7+current*3)%5));$('choices').innerHTML=order.map(i=>`<label class="option"><input type="radio" name="answer" value="${i}" ${answers[current]===i?'checked':''}> ${options[i]}</label>`).join('');document.querySelectorAll('input[name=answer]').forEach(el=>el.onchange=()=>{answers[current]=+el.value;$('next').disabled=false});$('prev').disabled=current===0;$('next').disabled=answers[current]===null;$('next').textContent=current===29?'عرض النتيجة':'التالي'}
function move(delta){if(delta===1&&answers[current]===null)return;if(current===29&&delta===1){finish();return}current+=delta;render()}
function finish(){const counts=styles.map((_,i)=>answers.filter(x=>x===i).length);let winner=counts.indexOf(Math.max(...counts));$('quiz').style.display='none';$('result').style.display='block';$('leader').textContent='نمطك الغالب: القيادي '+styles[winner];$('desc').textContent=descriptions[winner];$('scores').innerHTML=styles.map((s,i)=>`<div class="score"><strong>${s}: ${Math.round(counts[i]/30*100)}%</strong><div class="bar"><div class="fill" style="width:${counts[i]/30*100}%"></div></div></div>`).join('');window.scrollTo(0,0)}
function share(){const message=$('leader').textContent+'\nاختبار مهارات القيادة — إنشاء وتصميم المهندس عبدالله مشعان العنزي';if(navigator.share)navigator.share({title:'نتيجة اختبار القيادة',text:message,url:location.protocol.startsWith('http')?location.href:undefined}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(message).then(()=>alert('تم نسخ النتيجة'));else alert(message)}render();
</script></body></html>
